                  - { label: "Headline (EN)", name: title_en, widget: string, required: false }
                  - { label: "Headline (CN)", name: title_zh, widget: string, required: false }
                  - { label: "Intro (EN)", name: body_en, widget: text, required: false }
                  - { label: "Intro (CN)", name: body_zh, widget: text, required: false }
