              - { label: "Slug (URL part, do not change)", name: slug, widget: string }
              - { label: "Number", name: num, widget: string, required: false }
              - { label: "Name (EN)", name: name_en, widget: string, required: false }
              - { label: "Name (CN)", name: name_zh, widget: string, required: false }
              - { label: "Subtitle (EN)", name: subtitle_en, widget: string, required: false }
              - { label: "Subtitle (CN)", name: subtitle_zh, widget: string, required: false }
              - { label: "Card description (EN)", name: description_en, widget: text, required: false }
              - { label: "Card description (CN)", name: description_zh, widget: text, required: false }
              - { label: "Collection intro (EN)", name: intro_en, widget: text, required: false }
              - { label: "Collection intro (CN)", name: intro_zh, widget: text, required: false }
              - { label: "Category image", name: image, widget: image, required: false }
              - { label: "Display order", name: order, widget: number, required: false }

  # ------------------------------------------------------------------ 5 ---
  - label: "5 | Products / 产品目录"
    name: "products"
    files:
      - label: "All products (add, edit, delete)"
        name: "catalog"
        file: "content/products.json"
        fields:
          - label: "Products"
            name: items
            widget: list
            summary: "{{fields.id}} - {{fields.name_en}}"
            minimize_collapsed: true
            hint: "12 products are shown per page automatically. Add a product here and pagination updates itself."
            fields:
              - { label: "Product code (unique URL slug)", name: id, widget: string, hint: "e.g. DY-WG-061" }
              - { label: "Category slug", name: category, widget: string, required: false, hint: "Must match a slug from Product Categories. Current slugs: wigs, closures, frontals, extensions, wefts, ponytails. You can add a new slug there without touching code." }
              - { label: "Product name (EN)", name: name_en, widget: string, required: false }
              - { label: "Product name (CN)", name: name_zh, widget: string, required: false }
              - { label: "Hair material", name: material, widget: select, required: false, options: [{ label: "Burmese Hair / 缅甸发", value: burmese }, { label: "Yunnan Hair / 云南发", value: yunnan }, { label: "Vietnamese Hair / 越南发", value: vietnamese }] }
              - { label: "Short summary (EN)", name: summary_en, widget: text, required: false }
              - { label: "Short summary (CN)", name: summary_zh, widget: text, required: false }
              - { label: "Description (EN)", name: description_en, widget: text, required: false }
              - { label: "Description (CN)", name: description_zh, widget: text, required: false }
              - { label: "Texture (EN)", name: texture_en, widget: string, required: false }
              - { label: "Texture (CN)", name: texture_zh, widget: string, required: false }
              - { label: "Length", name: length, widget: string, required: false }
              - { label: "Colour (EN)", name: colour_en, widget: string, required: false }
              - { label: "Colour (CN)", name: colour_zh, widget: string, required: false }
              - { label: "Construction (EN)", name: construction_en, widget: string, required: false }
              - { label: "Construction (CN)", name: construction_zh, widget: string, required: false }
              - { label: "Net weight (EN)", name: weight_en, widget: string, required: false }
              - { label: "Net weight (CN)", name: weight_zh, widget: string, required: false }
              - { label: "Hair grade (EN)", name: grade_en, widget: string, required: false }
              - { label: "Hair grade (CN)", name: grade_zh, widget: string, required: false }
              - label: "Product images (first one is the card image)"
                name: images
                widget: list
                required: false
                field: { label: "Image", name: image, widget: image, required: false }
              - { label: "Product video (upload MP4)", name: video, widget: file, required: false }
              - { label: "Video URL (YouTube or MP4 link, overrides upload)", name: video_url, widget: string, required: false }
              - { label: "Video cover image", name: video_poster, widget: image, required: false }
