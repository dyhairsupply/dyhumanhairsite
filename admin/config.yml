# =============================================================================
# DY Deyu | Decap CMS configuration
# Every file below is a plain JSON file in /content - no build step, no code.
# After publishing, Netlify deploys the updated JSON and the site picks it up.
# =============================================================================

backend:
  name: git-gateway
  branch: main

# Enable only for local CMS work (npx decap-server). Ignored in production.
local_backend: true

media_folder: "images/uploads"
public_folder: "/images/uploads"
logo_url: "/images/logo-dy.svg"
site_url: "https://your-domain.com"

collections:

  # ------------------------------------------------------------------ 1 ---
  - label: "1 | Site Settings / 站点信息"
    name: "site_settings"
    files:
      - label: "Global Settings (contact, footer, SEO)"
        name: "global"
        file: "content/site.json"
        fields:
          - { label: "Brand name (EN)", name: brand_en, widget: string, required: false }
          - { label: "Brand name (CN)", name: brand_zh, widget: string, required: false }
          - { label: "Full company name (EN)", name: brand_full_en, widget: string, required: false }
          - { label: "Full company name (CN)", name: brand_full_zh, widget: string, required: false }
          - { label: "Tagline (EN)", name: tagline_en, widget: string, required: false }
          - { label: "Tagline (CN)", name: tagline_zh, widget: string, required: false }
          - { label: "Logo", name: logo, widget: image, required: false }
          - { label: "Email", name: email, widget: string, required: false }
          - { label: "WhatsApp display number", name: whatsapp_display, widget: string, required: false }
          - { label: "WhatsApp digits only (for wa.me link)", name: whatsapp_number, widget: string, required: false, hint: "e.g. 8613800000000" }
          - { label: "Telephone", name: telephone, widget: string, required: false }
          - { label: "Address (EN)", name: address_en, widget: string, required: false }
          - { label: "Address (CN)", name: address_zh, widget: string, required: false }
          - { label: "Business hours (EN)", name: hours_en, widget: string, required: false }
          - { label: "Business hours (CN)", name: hours_zh, widget: string, required: false }
          - { label: "Google Maps embed URL", name: map_embed_url, widget: string, required: false, hint: "Google Maps > Share > Embed a map > copy the src URL. Leave empty to show the placeholder." }
          - { label: "Static map image (alternative)", name: map_image, widget: image, required: false, hint: "Used when no embed URL is set, e.g. for visitors in mainland China." }
          - label: "Social links"
            name: social
            widget: list
            required: false
            summary: "{{fields.platform}}"
            fields:
              - { label: "Platform", name: platform, widget: select, required: false, options: [facebook, instagram, youtube, linkedin, whatsapp, tiktok] }
              - { label: "Profile URL", name: url, widget: string, required: false }
          - { label: "Copyright line (EN)", name: copyright_en, widget: string, required: false }
          - { label: "Copyright line (CN)", name: copyright_zh, widget: string, required: false }
          - { label: "SEO title (EN)", name: seo_title_en, widget: string, required: false }
          - { label: "SEO title (CN)", name: seo_title_zh, widget: string, required: false }
          - { label: "SEO description (EN)", name: seo_description_en, widget: text, required: false }
          - { label: "SEO description (CN)", name: seo_description_zh, widget: text, required: false }
          - { label: "Live site URL", name: site_url, widget: string, required: false, hint: "Update after binding your own domain." }

  # ------------------------------------------------------------------ 2 ---
  - label: "2 | Interface Text / 界面双语"
    name: "interface"
    files:
      - label: "All buttons, labels & messages (EN / CN)"
        name: "ui_labels"
        file: "content/ui.json"
        fields:
          - label: "Interface labels"
            name: items
            widget: list
            summary: "{{fields.key}}"
            minimize_collapsed: true
            fields:
              - { label: "Key (do not change)", name: key, widget: string }
              - { label: "English", name: en, widget: string, required: false }
              - { label: "Chinese", name: zh, widget: string, required: false }

