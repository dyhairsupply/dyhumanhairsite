<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>DY Deyu | Human Hair Wig & Extension Factory in Shandong, China</title>
  <meta name="description" content="Shandong Deyu Hair Products Factory manufactures 100% human hair wigs, lace closures, lace frontals, extensions, wefts and ponytails for distributors, salons and hair brands worldwide.">
  <meta name="theme-color" content="#241912">
  <script>
    /* Two supported ways to open this site:
       1) Double-click this file (file://): relative assets + offline data snapshot.
       2) HTTP (local server / Netlify): a root <base> keeps clean deep links working.
       Browsers block fetch() on file://, but a plain <script src> still loads. */
    if (location.protocol === 'file:') {
      document.write('<script src="content/offline-data.js"><\/script>');
    } else {
      document.write('<base href="/">');
    }
  </script>
  <link rel="icon" type="image/svg+xml" href="images/favicon.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600;700&family=Manrope:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <script>
    /* Netlify Identity invite / recovery links land on the homepage first. */
    (function () {
      var h = window.location.hash || "";
      if (/invite_token|confirmation_token|recovery_token|email_change_token/.test(h)) {
        window.location.replace("/admin/" + h);
      }
    })();
  </script>
  <script defer src="https://identity.netlify.com/v1/netlify-identity-widget.js"></script>
</head>
<body>
  <div id="site-header"></div>

  <main id="app" aria-live="polite">
    <div class="loading-wrap">Loading&hellip;</div>
  </main>

  <div id="site-footer"></div>

  <div id="lightbox" class="lightbox" role="dialog" aria-modal="true" aria-label="Image preview">
    <button class="lightbox-close" type="button" aria-label="Close preview" data-lightbox-close></button>
    <img id="lightbox-img" src="" alt="">
  </div>

  <noscript>
    <div style="padding:60px 24px;text-align:center;font-family:sans-serif">
      This product showcase requires JavaScript to load its bilingual content.
      Please enable JavaScript in your browser.
    </div>
  </noscript>

  <script defer src="js/app.js"></script>
  <script>
    /* Failsafe: never leave the visitor staring at "Loading..." forever. */
    setTimeout(function () {
      var app = document.getElementById('app');
      if (!app || app.innerHTML.indexOf('loading-wrap') < 0) return;
      app.innerHTML = '<section style="padding:80px 24px;text-align:center;font-family:sans-serif;color:#241912">' +
        '<h2 style="font-size:24px;margin:0 0 16px">页面资源没有加载成功</h2>' +
        '<p style="margin:0 0 8px;line-height:1.8">请确认 <b>content/offline-data.js</b>、<b>css/style.css</b>、<b>js/app.js</b> 与 index.html 在同一套解压后的文件夹里。</p>' +
        '<p style="margin:0 0 8px;line-height:1.8">推荐双击本目录下的 <b>启动本地预览.bat</b>，或在命令行运行 <code>python tools/serve.py</code> 后访问 http://localhost:8000/ 。</p>' +
        '<p style="margin:16px 0 0;color:#857768;font-size:13px">If assets fail to load, start the local server or deploy the site to Netlify.</p>' +
        '</section>';
    }, 5000);
  </script>
</body>
</html>
